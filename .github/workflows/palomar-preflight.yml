name: Palomar mechanical preflight

on:
  workflow_dispatch:
    inputs:
      commit:
        description: Full 40-character public commit to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    uses: PalomarRegistry/PalomarSubmission/.github/workflows/submission.yml@65f0154ed776cd26c224254aa57b379137f28b0d
    with:
      repository: stalex444/pdt-hodge-lie-generation
      commit: ${{ inputs.commit }}
      pipeline_commit: 65f0154ed776cd26c224254aa57b379137f28b0d
      request_id: pdthodge435a
      mode: full
      execution_profile: palomar-standard-v1
      options: '{"comparator_config_path":"comparator.json"}'
