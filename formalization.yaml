fidelity:
  divergences: The theorem uses the fixed integral orthogonal/Hodge data displayed in Challenge.lean.
    It asserts neither a classification of arbitrary Hodge extensions nor a physical selection principle
    for the operators. The field hypothesis is exactly 2!=0, with no algebraic-closure or simplicity
    hypothesis. The response magnitude c remains arbitrary. The source note gives the integral certificate,
    general matrix-unit propagation and direct centroid argument; global novelty remains unestablished.
    The supporting gravity and optical modules are outside this selected theorem.
