status:
  scope: One selected theorem proves the specified geometric Lie generation, its dimension, and the
    resulting scalar-response rigidity over all fields with 2!=0. The quadratic form, oriented four-plane,
    zero extension and least-closure operation are explicit data. No physical calibration of c is
    inferred. Optical, thermodynamic-gravity and two-sided-response results remain in the supporting
    source library and are not principal claims of this note. The broader PDT numerical formula is
    documented in PHYSICAL_SCOPE.md and NEWTON_EXPRESSION.md within its stated physical foundations.
