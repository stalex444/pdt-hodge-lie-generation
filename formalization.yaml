version: v0.4
project:
  name: Local Hodge generation of sl(15) and scalar response rigidity
  description: An explicit local Hodge operator on the oriented coordinate four-plane 0123, extended
    by zero, together with the fifteen adjoint basis actions of the orthogonal algebra for diag(1,1,1,-1,1,-1),
    generates sl(15,K) over every field of characteristic different from two. A finite integral commutator
    certificate produces signed skew matrix units and one symmetric seed; a general propagation lemma
    then produces all trace-free matrices. Dimension 224 follows from generation. As a consequence,
    an endomorphism of this algebra commuting with the commutator actions of the same sixteen generators
    is scalar, with determinant c^224. The proof includes characteristics three and five without
    a simplicity assumption. The contribution is this constructive generation-and-rigidity theorem.
    PDT motivates the chosen operators; assigning a physical response magnitude or gravitational
    coupling is outside the selected claim.
  authors:
  - Stephanie Alexander
  license: MIT
  responsible_maintainers:
  - Stephanie Alexander
